<!doctype html>
<!-- Source for assets/img/og.png (1200×630). Regenerate: see README "Social image". -->
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono&family=Instrument+Serif:ital@0;1&display=block">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden}
  body{background:#fbfaf7;color:#14161a;font-family:Geist,system-ui,sans-serif;position:relative}
  .bg{position:absolute;inset:0;background:
    radial-gradient(560px 380px at 88% 8%,rgba(14,107,99,.20),transparent 70%),
    radial-gradient(460px 320px at 4% 0%,rgba(47,127,168,.14),transparent 70%),
    radial-gradient(rgba(20,22,26,.08) 1px,transparent 1.3px) 0 0/24px 24px}
  .wrap{position:absolute;inset:72px 80px;display:flex;flex-direction:column;justify-content:space-between}
  .pill{display:inline-flex;align-items:center;gap:12px;align-self:flex-start;padding:10px 20px 10px 16px;border:1px solid #e6e2d9;border-radius:999px;background:rgba(255,255,255,.75);font-size:22px;color:#33373d}
  .dot{width:12px;height:12px;border-radius:50%;background:#0e6b63;box-shadow:0 0 0 6px rgba(14,107,99,.12)}
  h1{margin:0;font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-size:132px;line-height:.92;letter-spacing:-.03em}
  h1 em{background:linear-gradient(100deg,#0e6b63,#2f7fa8);-webkit-background-clip:text;color:transparent}
  .foot{display:flex;justify-content:space-between;align-items:flex-end;font-family:"Geist Mono",monospace;font-size:22px;color:#5e636b}
  .photo{position:absolute;right:40px;bottom:0;height:560px;filter:drop-shadow(0 24px 30px rgba(0,0,0,.14))}
  .halo{position:absolute;right:-40px;bottom:-120px;width:620px;height:560px;border-radius:50%;background:radial-gradient(closest-side,rgba(14,107,99,.22),transparent)}
  .mark{width:64px;height:64px;border-radius:50%;background:#14161a;color:#fbfaf7;display:grid;place-items:center;font-family:"Instrument Serif",Georgia,serif;font-size:24px}
</style></head>
<body><div class="bg"></div><div class="halo"></div><img class="photo" src="../assets/img/portrait.png" alt=""><div class="wrap">
  <span class="pill"><span class="dot"></span>Software Engineer — Backend &amp; Enterprise Systems</span>
  <h1>Elif Berfin<br><em>Gülbaş</em></h1>
  <div class="foot"><span>Java · Spring Boot · REST APIs · PostgreSQL · Oracle</span></div>
</div></body></html>
